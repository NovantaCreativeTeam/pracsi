server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 100M;

    index index.php;

    charset utf-8;

    # Disabilita sendfile per evitare ERR_CONTENT_DECODING_FAILED in ambienti Docker
    sendfile off;
    tcp_nopush on;
    tcp_nodelay on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Ottimizzazione per i file audio
    location /storage/audio/ {
        alias /var/www/html/storage/app/public/audio/;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range";

        # Forza il MIME type corretto
        default_type audio/wav;

        # Disabilita buffering per audio streaming
        proxy_buffering off;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Disabilita cache per test
        expires -1;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
